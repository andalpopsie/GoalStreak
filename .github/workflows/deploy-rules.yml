name: Deploy Firestore rules

# Auto-deploys Firestore security rules to production whenever a change to
# firestore.rules lands on main. The rules were already validated by the
# required CI check before the PR merged, so this is the "release" step.
#
# Scope is intentionally rules-only. Index changes (firestore.indexes.json)
# can be slow and occasionally destructive, so those stay a manual deploy.
on:
  push:
    branches: [main]
    paths:
      - 'GoalStreakApp/firebase/firestore.rules'

# Never run two rule deploys at once; queue them (don't cancel a deploy midway).
concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy rules to production
    runs-on: ubuntu-latest
    # Uses the "production" GitHub Environment. Add required reviewers to that
    # environment later if you want a manual approval gate before each deploy.
    environment: production
    defaults:
      run:
        working-directory: GoalStreakApp
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Google-maintained auth action. Validates the service-account JSON
      # (fails clearly if the secret is missing/malformed) and exports
      # GOOGLE_APPLICATION_CREDENTIALS for the steps that follow. firebase-tools
      # reads that for non-interactive Application Default Credentials.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: GoalStreakApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy Firestore rules
        # firebase.json lives in GoalStreakApp/firebase/, so point at it via
        # --config (rules paths inside it resolve relative to that folder).
        run: npx firebase deploy --only firestore:rules --config firebase/firebase.json --project goalstreak-app2 --non-interactive
