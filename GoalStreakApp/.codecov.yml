codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: 80%
        threshold: 2%
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error
    patch:
      default:
        target: 75%
        threshold: 5%
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: no
  require_base: no
  require_head: yes

flags:
  unit-tests:
    paths:
      - src/
    carryforward: false
  integration-tests:
    paths:
      - src/
    carryforward: false
  e2e-tests:
    paths:
      - src/
    carryforward: false

ignore:
  - "**/__tests__/**"
  - "**/__mocks__/**"
  - "**/node_modules/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/coverage/**"
  - "**/dist/**"
  - "**/build/**"