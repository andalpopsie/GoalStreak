name: Performance Regression Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'

jobs:
  performance-regression:
    name: Performance Regression Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for comparison
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GoalStreakApp/package-lock.json
          
      - name: Install dependencies
        working-directory: GoalStreakApp
        run: npm ci
        
      - name: Run performance benchmarks
        working-directory: GoalStreakApp
        run: |
          npm run test:performance -- --watchAll=false --passWithNoTests --json --outputFile=performance-results.json
          
      - name: Store performance results
        uses: actions/cache@v3
        with:
          path: GoalStreakApp/performance-results.json
          key: performance-${{ github.sha }}
          
      - name: Compare with baseline (if available)
        working-directory: GoalStreakApp
        run: |
          if [ -f "performance-baseline.json" ]; then
            echo "Comparing performance with baseline..."
            node -e "
              const current = require('./performance-results.json');
              const baseline = require('./performance-baseline.json');
              
              console.log('Performance Comparison:');
              console.log('Current run time:', current.testResults?.[0]?.perfStats?.runtime || 'N/A');
              console.log('Baseline run time:', baseline.testResults?.[0]?.perfStats?.runtime || 'N/A');
              
              // Add performance regression logic here
              const currentTime = current.testResults?.[0]?.perfStats?.runtime || 0;
              const baselineTime = baseline.testResults?.[0]?.perfStats?.runtime || 0;
              
              if (currentTime > baselineTime * 1.2) {
                console.log('⚠️ Performance regression detected: +' + Math.round(((currentTime - baselineTime) / baselineTime) * 100) + '%');
                process.exit(1);
              } else {
                console.log('✅ Performance within acceptable range');
              }
            "
          else
            echo "No baseline found, storing current results as baseline"
            cp performance-results.json performance-baseline.json
          fi
          
      - name: Upload performance artifacts
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: |
            GoalStreakApp/performance-results.json
            GoalStreakApp/performance-baseline.json
          retention-days: 30

  bundle-size-check:
    name: Bundle Size Regression
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GoalStreakApp/package-lock.json
          
      - name: Install dependencies
        working-directory: GoalStreakApp
        run: npm ci
        
      - name: Setup Expo CLI
        run: npm install -g @expo/cli
        
      - name: Build and analyze bundle
        working-directory: GoalStreakApp
        run: |
          npx expo export --platform all --output-dir dist
          
          # Calculate bundle sizes
          TOTAL_SIZE=$(du -sb dist/ | cut -f1)
          JS_SIZE=$(find dist/ -name "*.js" -exec du -sb {} + | awk '{sum += $1} END {print sum}')
          ASSET_SIZE=$(find dist/ -type f ! -name "*.js" -exec du -sb {} + | awk '{sum += $1} END {print sum}')
          
          echo "Bundle Analysis:"
          echo "Total size: $TOTAL_SIZE bytes"
          echo "JavaScript size: $JS_SIZE bytes"
          echo "Asset size: $ASSET_SIZE bytes"
          
          # Store results
          cat > bundle-analysis.json << EOF
          {
            "totalSize": $TOTAL_SIZE,
            "jsSize": $JS_SIZE,
            "assetSize": $ASSET_SIZE,
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          
      - name: Check bundle size regression
        working-directory: GoalStreakApp
        run: |
          # Define size limits (in bytes)
          MAX_TOTAL_SIZE=52428800    # 50MB
          MAX_JS_SIZE=10485760       # 10MB
          
          TOTAL_SIZE=$(cat bundle-analysis.json | node -pe "JSON.parse(require('fs').readFileSync(0)).totalSize")
          JS_SIZE=$(cat bundle-analysis.json | node -pe "JSON.parse(require('fs').readFileSync(0)).jsSize")
          
          echo "Checking bundle size limits..."
          
          if [ "$TOTAL_SIZE" -gt "$MAX_TOTAL_SIZE" ]; then
            echo "❌ Total bundle size ($TOTAL_SIZE bytes) exceeds limit ($MAX_TOTAL_SIZE bytes)"
            exit 1
          fi
          
          if [ "$JS_SIZE" -gt "$MAX_JS_SIZE" ]; then
            echo "❌ JavaScript bundle size ($JS_SIZE bytes) exceeds limit ($MAX_JS_SIZE bytes)"
            exit 1
          fi
          
          echo "✅ Bundle sizes within acceptable limits"
          
      - name: Upload bundle analysis
        uses: actions/upload-artifact@v3
        with:
          name: bundle-analysis
          path: GoalStreakApp/bundle-analysis.json
          retention-days: 30