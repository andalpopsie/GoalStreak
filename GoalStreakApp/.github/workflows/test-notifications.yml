name: Test Failure Notifications

on:
  workflow_run:
    workflows: ["CI/CD Testing Pipeline", "Security Vulnerability Scanning", "Performance Regression Testing"]
    types:
      - completed

env:
  NODE_VERSION: '18'

jobs:
  notify-test-results:
    name: Notify Test Results
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Get workflow details
        id: workflow-details
        run: |
          echo "workflow_name=${{ github.event.workflow_run.name }}" >> $GITHUB_OUTPUT
          echo "workflow_conclusion=${{ github.event.workflow_run.conclusion }}" >> $GITHUB_OUTPUT
          echo "workflow_url=${{ github.event.workflow_run.html_url }}" >> $GITHUB_OUTPUT
          echo "commit_sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          
      - name: Create failure notification
        run: |
          cat > failure-notification.md << EOF
          # 🚨 Test Failure Alert
          
          **Workflow:** ${{ steps.workflow-details.outputs.workflow_name }}
          **Status:** ${{ steps.workflow-details.outputs.workflow_conclusion }}
          **Branch:** ${{ steps.workflow-details.outputs.branch }}
          **Commit:** ${{ steps.workflow-details.outputs.commit_sha }}
          **Time:** $(date -u)
          
          ## Quick Actions
          - [View Workflow Run](${{ steps.workflow-details.outputs.workflow_url }})
          - [View Commit](https://github.com/${{ github.repository }}/commit/${{ steps.workflow-details.outputs.commit_sha }})
          - [Troubleshooting Guide](https://github.com/${{ github.repository }}/blob/main/GoalStreakApp/docs/TEST_TROUBLESHOOTING.md)
          
          ## Common Next Steps
          1. Check the workflow logs for specific error messages
          2. Run tests locally to reproduce the issue
          3. Review recent changes that might have caused the failure
          4. Check if Firebase emulators are running (for integration tests)
          5. Verify dependencies are up to date
          
          ## Need Help?
          - Check the [troubleshooting guide](https://github.com/${{ github.repository }}/blob/main/GoalStreakApp/docs/TEST_TROUBLESHOOTING.md)
          - Create an issue if the problem persists
          - Contact the development team for assistance
          EOF
          
      - name: Create GitHub issue for test failure
        if: github.event.workflow_run.conclusion == 'failure'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const notification = fs.readFileSync('failure-notification.md', 'utf8');
            
            // Check if there's already an open issue for this workflow
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'test-failure,automated'
            });
            
            const existingIssue = issues.find(issue => 
              issue.title.includes('${{ steps.workflow-details.outputs.workflow_name }}')
            );
            
            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## New Failure Detected\n\n${notification}`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Test Failure: ${{ steps.workflow-details.outputs.workflow_name }}`,
                body: notification,
                labels: ['test-failure', 'automated', 'bug']
              });
            }
            
      - name: Send Slack notification (if configured)
        if: env.SLACK_WEBHOOK_URL
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "🚨 Test Failure Alert",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 GoalStreak Test Failure"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n${{ steps.workflow-details.outputs.workflow_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ steps.workflow-details.outputs.workflow_conclusion }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ steps.workflow-details.outputs.branch }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ steps.workflow-details.outputs.commit_sha }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ steps.workflow-details.outputs.workflow_url }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Troubleshooting Guide"
                      },
                      "url": "https://github.com/${{ github.repository }}/blob/main/GoalStreakApp/docs/TEST_TROUBLESHOOTING.md"
                    }
                  ]
                }
              ]
            }' \
            ${{ env.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-test-success:
    name: Notify Test Recovery
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Check for existing failure issues
        uses: actions/github-script@v6
        with:
          script: |
            // Check if there are open test failure issues for this workflow
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'test-failure,automated'
            });
            
            const workflowName = '${{ github.event.workflow_run.name }}';
            const relatedIssues = issues.filter(issue => 
              issue.title.includes(workflowName)
            );
            
            // Close related issues and add success comment
            for (const issue of relatedIssues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ **Tests are now passing!**\n\nWorkflow: ${workflowName}\nCommit: ${{ github.event.workflow_run.head_sha }}\nTime: ${new Date().toISOString()}\n\nClosing this issue as the tests have recovered.`
              });
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                labels: [...issue.labels.map(l => l.name), 'resolved']
              });
            }
            
            if (relatedIssues.length > 0) {
              console.log(`Closed ${relatedIssues.length} test failure issues`);
            }

  weekly-test-summary:
    name: Weekly Test Summary
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.force_summary == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Generate weekly summary
        uses: actions/github-script@v6
        with:
          script: |
            const oneWeekAgo = new Date();
            oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
            
            // Get workflow runs from the past week
            const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              created: `>=${oneWeekAgo.toISOString()}`,
              per_page: 100
            });
            
            // Analyze test results
            const testWorkflows = workflowRuns.workflow_runs.filter(run => 
              run.name.includes('Test') || run.name.includes('CI/CD')
            );
            
            const totalRuns = testWorkflows.length;
            const successfulRuns = testWorkflows.filter(run => run.conclusion === 'success').length;
            const failedRuns = testWorkflows.filter(run => run.conclusion === 'failure').length;
            const successRate = totalRuns > 0 ? Math.round((successfulRuns / totalRuns) * 100) : 0;
            
            // Create summary
            const summary = `# 📊 Weekly Test Summary
            
            **Period:** ${oneWeekAgo.toDateString()} - ${new Date().toDateString()}
            
            ## Test Execution Statistics
            - **Total Test Runs:** ${totalRuns}
            - **Successful Runs:** ${successfulRuns}
            - **Failed Runs:** ${failedRuns}
            - **Success Rate:** ${successRate}%
            
            ## Status
            ${successRate >= 95 ? '🟢 **Excellent** - Test suite is very stable' : 
              successRate >= 85 ? '🟡 **Good** - Test suite is mostly stable' : 
              '🔴 **Needs Attention** - Test suite has stability issues'}
            
            ## Recommendations
            ${successRate < 85 ? '- Investigate and fix failing tests\n- Review test reliability\n- Consider adding more robust error handling' : 
              '- Continue maintaining current quality standards\n- Consider adding more test coverage\n- Monitor for any emerging patterns'}
            
            ---
            *This summary is automatically generated weekly*`;
            
            // Create or update weekly summary issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'weekly-summary,automated'
            });
            
            const existingSummary = issues.find(issue => 
              issue.title.includes('Weekly Test Summary')
            );
            
            if (existingSummary) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingSummary.number,
                body: summary
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📊 Weekly Test Summary',
                body: summary,
                labels: ['weekly-summary', 'automated', 'documentation']
              });
            }