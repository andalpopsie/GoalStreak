name: Test Reporting and Monitoring

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily test reports at 6 AM UTC
    - cron: '0 6 * * *'

env:
  NODE_VERSION: '18'

jobs:
  test-coverage-report:
    name: Generate Test Coverage Report
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GoalStreakApp/package-lock.json
          
      - name: Install dependencies
        working-directory: GoalStreakApp
        run: npm ci
        
      - name: Run all tests with coverage
        working-directory: GoalStreakApp
        run: |
          # Run unit tests with coverage
          npm run test:unit -- --coverage --watchAll=false --passWithNoTests --coverageReporters=lcov,json,text
          
          # Store unit test coverage
          cp coverage/coverage-final.json coverage/unit-coverage.json
          
      - name: Setup Firebase Emulators for Integration Tests
        working-directory: GoalStreakApp
        run: |
          npm install -g firebase-tools
          node scripts/start-emulators.js &
          sleep 10
          
      - name: Run integration tests with coverage
        working-directory: GoalStreakApp
        run: |
          npm run test:integration -- --coverage --watchAll=false --passWithNoTests --coverageReporters=lcov,json
          
          # Merge coverage reports
          npx nyc merge coverage/ coverage/merged-coverage.json
          npx nyc report --reporter=lcov --reporter=text --temp-dir=coverage --report-dir=coverage/merged
          
      - name: Stop Firebase Emulators
        working-directory: GoalStreakApp
        if: always()
        run: node scripts/stop-emulators.js
        
      - name: Generate coverage summary
        working-directory: GoalStreakApp
        run: |
          echo "# Test Coverage Report" > coverage-report.md
          echo "" >> coverage-report.md
          echo "**Generated:** $(date -u)" >> coverage-report.md
          echo "**Commit:** ${{ github.sha }}" >> coverage-report.md
          echo "" >> coverage-report.md
          
          # Extract coverage percentages
          LINES_COVERAGE=$(cat coverage/lcov.info | grep -E "LF:|LH:" | awk -F: '{if(NR%2==1) lf=$2; else {lh=$2; print (lh/lf)*100}}' | head -1)
          FUNCTIONS_COVERAGE=$(cat coverage/lcov.info | grep -E "FNF:|FNH:" | awk -F: '{if(NR%2==1) fnf=$2; else {fnh=$2; print (fnh/fnf)*100}}' | head -1)
          BRANCHES_COVERAGE=$(cat coverage/lcov.info | grep -E "BRF:|BRH:" | awk -F: '{if(NR%2==1) brf=$2; else {brh=$2; print (brh/brf)*100}}' | head -1)
          
          echo "## Coverage Summary" >> coverage-report.md
          echo "| Metric | Coverage |" >> coverage-report.md
          echo "|--------|----------|" >> coverage-report.md
          echo "| Lines | ${LINES_COVERAGE:-N/A}% |" >> coverage-report.md
          echo "| Functions | ${FUNCTIONS_COVERAGE:-N/A}% |" >> coverage-report.md
          echo "| Branches | ${BRANCHES_COVERAGE:-N/A}% |" >> coverage-report.md
          echo "" >> coverage-report.md
          
          # Check coverage thresholds
          THRESHOLD=80
          if (( $(echo "${LINES_COVERAGE:-0} >= $THRESHOLD" | bc -l) )); then
            echo "✅ **Status: PASSED** - Coverage meets threshold ($THRESHOLD%)" >> coverage-report.md
          else
            echo "❌ **Status: FAILED** - Coverage below threshold ($THRESHOLD%)" >> coverage-report.md
          fi
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: GoalStreakApp/coverage/lcov.info
          flags: comprehensive
          name: comprehensive-coverage
          fail_ci_if_error: true
          
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: |
            GoalStreakApp/coverage/
            GoalStreakApp/coverage-report.md
          retention-days: 30

  test-results-aggregation:
    name: Aggregate Test Results
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GoalStreakApp/package-lock.json
          
      - name: Install dependencies
        working-directory: GoalStreakApp
        run: npm ci
        
      - name: Run all test suites with JSON output
        working-directory: GoalStreakApp
        run: |
          echo "Running comprehensive test suite..."
          
          # Unit tests
          npm run test:unit -- --watchAll=false --passWithNoTests --json --outputFile=test-results-unit.json || true
          
          # Security tests
          npm run test:security -- --watchAll=false --passWithNoTests --json --outputFile=test-results-security.json || true
          
          # Performance tests
          npm run test:performance -- --watchAll=false --passWithNoTests --json --outputFile=test-results-performance.json || true
          
      - name: Setup Firebase Emulators for Integration Tests
        working-directory: GoalStreakApp
        run: |
          npm install -g firebase-tools
          node scripts/start-emulators.js &
          sleep 10
          
      - name: Run integration tests
        working-directory: GoalStreakApp
        run: |
          npm run test:integration -- --watchAll=false --passWithNoTests --json --outputFile=test-results-integration.json || true
          
      - name: Stop Firebase Emulators
        working-directory: GoalStreakApp
        if: always()
        run: node scripts/stop-emulators.js
        
      - name: Generate comprehensive test report
        working-directory: GoalStreakApp
        run: |
          node -e "
            const fs = require('fs');
            
            // Read all test result files
            const testSuites = ['unit', 'integration', 'security', 'performance'];
            const results = {};
            
            testSuites.forEach(suite => {
              try {
                const data = fs.readFileSync(\`test-results-\${suite}.json\`, 'utf8');
                results[suite] = JSON.parse(data);
              } catch (error) {
                console.log(\`Warning: Could not read \${suite} test results\`);
                results[suite] = { success: false, numTotalTests: 0, numPassedTests: 0, numFailedTests: 0 };
              }
            });
            
            // Generate summary
            let totalTests = 0;
            let passedTests = 0;
            let failedTests = 0;
            let allPassed = true;
            
            const report = ['# Comprehensive Test Report', ''];
            report.push(\`**Generated:** \${new Date().toISOString()}\`);
            report.push(\`**Commit:** ${{ github.sha }}\`);
            report.push('');
            report.push('## Test Suite Results');
            report.push('| Suite | Total | Passed | Failed | Status |');
            report.push('|-------|-------|--------|--------|--------|');
            
            testSuites.forEach(suite => {
              const result = results[suite];
              const total = result.numTotalTests || 0;
              const passed = result.numPassedTests || 0;
              const failed = result.numFailedTests || 0;
              const status = result.success ? '✅ PASS' : '❌ FAIL';
              
              totalTests += total;
              passedTests += passed;
              failedTests += failed;
              
              if (!result.success) allPassed = false;
              
              report.push(\`| \${suite.charAt(0).toUpperCase() + suite.slice(1)} | \${total} | \${passed} | \${failed} | \${status} |\`);
            });
            
            report.push('');
            report.push('## Summary');
            report.push(\`- **Total Tests:** \${totalTests}\`);
            report.push(\`- **Passed:** \${passedTests}\`);
            report.push(\`- **Failed:** \${failedTests}\`);
            report.push(\`- **Success Rate:** \${totalTests > 0 ? Math.round((passedTests / totalTests) * 100) : 0}%\`);
            report.push('');
            
            if (allPassed) {
              report.push('🎉 **All test suites passed!**');
            } else {
              report.push('⚠️ **Some test suites failed. Please review the results.**');
            }
            
            fs.writeFileSync('comprehensive-test-report.md', report.join('\n'));
            
            // Create JSON summary for programmatic use
            const summary = {
              timestamp: new Date().toISOString(),
              commit: '${{ github.sha }}',
              totalTests,
              passedTests,
              failedTests,
              successRate: totalTests > 0 ? Math.round((passedTests / totalTests) * 100) : 0,
              allPassed,
              suites: results
            };
            
            fs.writeFileSync('test-summary.json', JSON.stringify(summary, null, 2));
            
            console.log('Test report generated successfully');
          "
          
      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            GoalStreakApp/test-results-*.json
            GoalStreakApp/comprehensive-test-report.md
            GoalStreakApp/test-summary.json
          retention-days: 30
          
      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            try {
              const report = fs.readFileSync('GoalStreakApp/comprehensive-test-report.md', 'utf8');
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            } catch (error) {
              console.log('Could not post test results comment:', error.message);
            }

  performance-monitoring:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GoalStreakApp/package-lock.json
          
      - name: Install dependencies
        working-directory: GoalStreakApp
        run: npm ci
        
      - name: Run performance benchmarks
        working-directory: GoalStreakApp
        run: |
          npm run test:performance -- --watchAll=false --passWithNoTests --verbose
          
      - name: Monitor test execution times
        working-directory: GoalStreakApp
        run: |
          echo "# Performance Monitoring Report" > performance-monitoring.md
          echo "" >> performance-monitoring.md
          echo "**Date:** $(date -u)" >> performance-monitoring.md
          echo "**Commit:** ${{ github.sha }}" >> performance-monitoring.md
          echo "" >> performance-monitoring.md
          
          # Measure test suite execution times
          echo "## Test Suite Performance" >> performance-monitoring.md
          echo "| Test Suite | Execution Time | Status |" >> performance-monitoring.md
          echo "|------------|----------------|--------|" >> performance-monitoring.md
          
          # Unit tests timing
          UNIT_START=$(date +%s)
          npm run test:unit -- --watchAll=false --passWithNoTests --silent > /dev/null 2>&1
          UNIT_END=$(date +%s)
          UNIT_TIME=$((UNIT_END - UNIT_START))
          UNIT_STATUS=$([ $UNIT_TIME -lt 30 ] && echo "✅ GOOD" || echo "⚠️ SLOW")
          echo "| Unit Tests | ${UNIT_TIME}s | $UNIT_STATUS |" >> performance-monitoring.md
          
          # Security tests timing
          SECURITY_START=$(date +%s)
          npm run test:security -- --watchAll=false --passWithNoTests --silent > /dev/null 2>&1
          SECURITY_END=$(date +%s)
          SECURITY_TIME=$((SECURITY_END - SECURITY_START))
          SECURITY_STATUS=$([ $SECURITY_TIME -lt 60 ] && echo "✅ GOOD" || echo "⚠️ SLOW")
          echo "| Security Tests | ${SECURITY_TIME}s | $SECURITY_STATUS |" >> performance-monitoring.md
          
          echo "" >> performance-monitoring.md
          echo "## Performance Thresholds" >> performance-monitoring.md
          echo "- Unit Tests: < 30 seconds" >> performance-monitoring.md
          echo "- Integration Tests: < 120 seconds" >> performance-monitoring.md
          echo "- Security Tests: < 60 seconds" >> performance-monitoring.md
          echo "- E2E Tests: < 300 seconds" >> performance-monitoring.md
          
      - name: Upload performance monitoring results
        uses: actions/upload-artifact@v3
        with:
          name: performance-monitoring
          path: GoalStreakApp/performance-monitoring.md
          retention-days: 30

  test-failure-analysis:
    name: Test Failure Analysis
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Generate failure analysis
        run: |
          echo "# Test Failure Analysis" > test-failure-analysis.md
          echo "" >> test-failure-analysis.md
          echo "**Failure Date:** $(date -u)" >> test-failure-analysis.md
          echo "**Commit:** ${{ github.sha }}" >> test-failure-analysis.md
          echo "**Workflow:** ${{ github.workflow }}" >> test-failure-analysis.md
          echo "**Run ID:** ${{ github.run_id }}" >> test-failure-analysis.md
          echo "" >> test-failure-analysis.md
          
          echo "## Troubleshooting Steps" >> test-failure-analysis.md
          echo "" >> test-failure-analysis.md
          echo "1. **Check the workflow logs** for specific error messages" >> test-failure-analysis.md
          echo "2. **Verify dependencies** are correctly installed" >> test-failure-analysis.md
          echo "3. **Check Firebase emulators** are running for integration tests" >> test-failure-analysis.md
          echo "4. **Review recent changes** that might have introduced the failure" >> test-failure-analysis.md
          echo "5. **Run tests locally** to reproduce the issue" >> test-failure-analysis.md
          echo "" >> test-failure-analysis.md
          
          echo "## Common Issues and Solutions" >> test-failure-analysis.md
          echo "" >> test-failure-analysis.md
          echo "### Firebase Emulator Issues" >> test-failure-analysis.md
          echo "- Ensure emulators are started before integration tests" >> test-failure-analysis.md
          echo "- Check port conflicts (9099, 8080, 9199)" >> test-failure-analysis.md
          echo "- Verify Firebase CLI is installed" >> test-failure-analysis.md
          echo "" >> test-failure-analysis.md
          echo "### Dependency Issues" >> test-failure-analysis.md
          echo "- Run \`npm ci\` to ensure clean dependency installation" >> test-failure-analysis.md
          echo "- Check for version conflicts in package-lock.json" >> test-failure-analysis.md
          echo "- Verify Node.js version compatibility" >> test-failure-analysis.md
          echo "" >> test-failure-analysis.md
          echo "### Test Environment Issues" >> test-failure-analysis.md
          echo "- Check environment variables are set correctly" >> test-failure-analysis.md
          echo "- Verify test data setup and cleanup" >> test-failure-analysis.md
          echo "- Ensure proper test isolation" >> test-failure-analysis.md
          
      - name: Upload failure analysis
        uses: actions/upload-artifact@v3
        with:
          name: test-failure-analysis
          path: test-failure-analysis.md
          retention-days: 30