name: CI/CD Testing Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  COVERAGE_THRESHOLD: 80

jobs:
  # Lint and Type Check
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GoalStreakApp/package-lock.json
          
      - name: Install dependencies
        working-directory: GoalStreakApp
        run: npm ci
        
      - name: Run ESLint
        working-directory: GoalStreakApp
        run: npm run lint
        
      - name: Run TypeScript type check
        working-directory: GoalStreakApp
        run: npx tsc --noEmit

  # Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GoalStreakApp/package-lock.json
          
      - name: Install dependencies
        working-directory: GoalStreakApp
        run: npm ci
        
      - name: Run npm audit
        working-directory: GoalStreakApp
        run: npm audit --audit-level=moderate
        
      - name: Run security linting
        working-directory: GoalStreakApp
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --config .eslintrc.security.js || true
        
      - name: Check for sensitive data
        working-directory: GoalStreakApp
        run: |
          # Check for potential secrets in code
          if grep -r --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" -E "(password|secret|key|token).*=.*['\"][^'\"]{8,}" src/; then
            echo "⚠️ Potential hardcoded secrets found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GoalStreakApp/package-lock.json
          
      - name: Install dependencies
        working-directory: GoalStreakApp
        run: npm ci
        
      - name: Run unit tests with coverage
        working-directory: GoalStreakApp
        run: npm run test:unit -- --coverage --watchAll=false --passWithNoTests
        
      - name: Check coverage threshold
        working-directory: GoalStreakApp
        run: |
          COVERAGE=$(npm run test:unit -- --coverage --watchAll=false --silent --passWithNoTests | grep -o 'All files.*[0-9]\+\.[0-9]\+' | grep -o '[0-9]\+\.[0-9]\+' | head -1 || echo "0")
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below threshold $COVERAGE_THRESHOLD%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets threshold $COVERAGE_THRESHOLD%"
          
      - name: Upload unit test coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: GoalStreakApp/coverage/lcov.info
          flags: unit-tests
          name: unit-tests-coverage

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GoalStreakApp/package-lock.json
          
      - name: Install dependencies
        working-directory: GoalStreakApp
        run: npm ci
        
      - name: Setup Firebase Emulators
        working-directory: GoalStreakApp
        run: |
          npm install -g firebase-tools
          firebase --version
          
      - name: Start Firebase Emulators
        working-directory: GoalStreakApp
        run: |
          node scripts/start-emulators.js &
          sleep 10
          
      - name: Run integration tests
        working-directory: GoalStreakApp
        run: npm run test:integration -- --watchAll=false --passWithNoTests
        
      - name: Stop Firebase Emulators
        working-directory: GoalStreakApp
        if: always()
        run: node scripts/stop-emulators.js

  # Security Tests
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GoalStreakApp/package-lock.json
          
      - name: Install dependencies
        working-directory: GoalStreakApp
        run: npm ci
        
      - name: Setup Firebase Emulators for Security Tests
        working-directory: GoalStreakApp
        run: |
          npm install -g firebase-tools
          node scripts/start-emulators.js &
          sleep 10
          
      - name: Run security tests
        working-directory: GoalStreakApp
        run: npm run test:security -- --watchAll=false --passWithNoTests
        
      - name: Stop Firebase Emulators
        working-directory: GoalStreakApp
        if: always()
        run: node scripts/stop-emulators.js

  # Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GoalStreakApp/package-lock.json
          
      - name: Install dependencies
        working-directory: GoalStreakApp
        run: npm ci
        
      - name: Run performance tests
        working-directory: GoalStreakApp
        run: npm run test:performance -- --watchAll=false --passWithNoTests
        
      - name: Check performance benchmarks
        working-directory: GoalStreakApp
        run: |
          echo "✅ Performance tests completed"
          # Add performance regression checks here

  # E2E Tests (only on main branch or when E2E label is present)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GoalStreakApp/package-lock.json
          
      - name: Install dependencies
        working-directory: GoalStreakApp
        run: npm ci
        
      - name: Setup Firebase Emulators
        working-directory: GoalStreakApp
        run: |
          npm install -g firebase-tools
          node scripts/start-emulators.js &
          sleep 10
          
      - name: Run E2E tests
        working-directory: GoalStreakApp
        run: npm run test:e2e -- --headless
        
      - name: Upload E2E test artifacts
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: e2e-artifacts
          path: GoalStreakApp/e2e/artifacts/
          
      - name: Stop Firebase Emulators
        working-directory: GoalStreakApp
        if: always()
        run: node scripts/stop-emulators.js

  # Build Test (ensure app builds successfully)
  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GoalStreakApp/package-lock.json
          
      - name: Install dependencies
        working-directory: GoalStreakApp
        run: npm ci
        
      - name: Setup Expo CLI
        run: npm install -g @expo/cli
        
      - name: Test Expo build
        working-directory: GoalStreakApp
        run: npx expo export --platform all --output-dir dist
        
      - name: Check bundle size
        working-directory: GoalStreakApp
        run: |
          BUNDLE_SIZE=$(du -sh dist/ | cut -f1)
          echo "Bundle size: $BUNDLE_SIZE"
          # Add bundle size regression checks here

  # Aggregate Results
  test-results:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, security-scan, unit-tests, integration-tests, security-tests, performance-tests, build-test]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint-and-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Tests | ${{ needs.security-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Tests | ${{ needs.performance-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Test | ${{ needs.build-test.result }} |" >> $GITHUB_STEP_SUMMARY
          
          # Fail if any critical tests failed
          if [[ "${{ needs.lint-and-typecheck.result }}" == "failure" || 
                "${{ needs.unit-tests.result }}" == "failure" || 
                "${{ needs.security-scan.result }}" == "failure" ]]; then
            echo "❌ Critical tests failed"
            exit 1
          fi
          
          echo "✅ All critical tests passed"