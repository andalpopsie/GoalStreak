name: Security Vulnerability Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18'

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GoalStreakApp/package-lock.json
          
      - name: Install dependencies
        working-directory: GoalStreakApp
        run: npm ci
        
      - name: Run npm audit
        working-directory: GoalStreakApp
        run: |
          echo "Running npm audit..."
          npm audit --audit-level=moderate --json > audit-results.json || true
          
          # Check for high/critical vulnerabilities
          HIGH_VULNS=$(cat audit-results.json | node -pe "
            try {
              const audit = JSON.parse(require('fs').readFileSync('audit-results.json'));
              const metadata = audit.metadata || {};
              const vulnerabilities = metadata.vulnerabilities || {};
              (vulnerabilities.high || 0) + (vulnerabilities.critical || 0);
            } catch(e) { 0 }
          ")
          
          echo "High/Critical vulnerabilities found: $HIGH_VULNS"
          
          if [ "$HIGH_VULNS" -gt "0" ]; then
            echo "❌ High or critical vulnerabilities detected!"
            npm audit --audit-level=high
            exit 1
          else
            echo "✅ No high or critical vulnerabilities found"
          fi
          
      - name: Upload audit results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: npm-audit-results
          path: GoalStreakApp/audit-results.json

  code-scan:
    name: Static Code Security Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GoalStreakApp/package-lock.json
          
      - name: Install dependencies
        working-directory: GoalStreakApp
        run: npm ci
        
      - name: Run security linting
        working-directory: GoalStreakApp
        run: |
          echo "Running security-focused ESLint..."
          npx eslint src --ext .js,.jsx,.ts,.tsx --config .eslintrc.security.js --format json --output-file security-lint-results.json || true
          
          # Check for security issues
          SECURITY_ISSUES=$(cat security-lint-results.json | node -pe "
            try {
              const results = JSON.parse(require('fs').readFileSync('security-lint-results.json'));
              results.reduce((total, file) => total + file.errorCount + file.warningCount, 0);
            } catch(e) { 0 }
          ")
          
          echo "Security issues found: $SECURITY_ISSUES"
          
          if [ "$SECURITY_ISSUES" -gt "0" ]; then
            echo "⚠️ Security issues detected in code"
            npx eslint src --ext .js,.jsx,.ts,.tsx --config .eslintrc.security.js
          else
            echo "✅ No security issues found in static analysis"
          fi
          
      - name: Scan for secrets
        working-directory: GoalStreakApp
        run: |
          echo "Scanning for potential secrets..."
          
          # Check for common secret patterns
          SECRET_PATTERNS=(
            "password\s*=\s*['\"][^'\"]{8,}"
            "secret\s*=\s*['\"][^'\"]{8,}"
            "key\s*=\s*['\"][^'\"]{16,}"
            "token\s*=\s*['\"][^'\"]{16,}"
            "api[_-]?key\s*=\s*['\"][^'\"]{8,}"
            "private[_-]?key"
            "-----BEGIN.*PRIVATE KEY-----"
          )
          
          SECRETS_FOUND=0
          
          for pattern in "${SECRET_PATTERNS[@]}"; do
            if grep -r --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" --include="*.json" -E "$pattern" src/ 2>/dev/null; then
              echo "⚠️ Potential secret pattern found: $pattern"
              SECRETS_FOUND=1
            fi
          done
          
          if [ "$SECRETS_FOUND" -eq "1" ]; then
            echo "❌ Potential secrets detected in codebase!"
            exit 1
          else
            echo "✅ No secrets detected in codebase"
          fi
          
      - name: Upload security scan results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-scan-results
          path: GoalStreakApp/security-lint-results.json

  firebase-security-scan:
    name: Firebase Security Rules Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
        
      - name: Validate Firestore rules
        working-directory: GoalStreakApp
        run: |
          echo "Validating Firestore security rules..."
          
          # Check if rules file exists
          if [ ! -f "firestore.rules" ]; then
            echo "❌ Firestore rules file not found!"
            exit 1
          fi
          
          # Basic syntax validation
          firebase firestore:rules:validate firestore.rules || {
            echo "❌ Firestore rules syntax validation failed!"
            exit 1
          }
          
          echo "✅ Firestore rules syntax is valid"
          
      - name: Validate Storage rules
        working-directory: GoalStreakApp
        run: |
          echo "Validating Storage security rules..."
          
          # Check if rules file exists
          if [ ! -f "storage.rules" ]; then
            echo "❌ Storage rules file not found!"
            exit 1
          fi
          
          # Basic syntax validation
          firebase storage:rules:validate storage.rules || {
            echo "❌ Storage rules syntax validation failed!"
            exit 1
          }
          
          echo "✅ Storage rules syntax is valid"
          
      - name: Security rules analysis
        working-directory: GoalStreakApp
        run: |
          echo "Analyzing security rules for common issues..."
          
          # Check for overly permissive rules
          if grep -q "allow read, write: if true" firestore.rules; then
            echo "⚠️ Warning: Found overly permissive rules (allow if true)"
          fi
          
          if grep -q "allow read, write: if request.auth != null" firestore.rules; then
            echo "✅ Good: Found authentication checks in rules"
          else
            echo "⚠️ Warning: No authentication checks found in rules"
          fi
          
          echo "Security rules analysis completed"

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-scan, firebase-security-scan]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        
      - name: Generate security summary
        run: |
          echo "# Security Scan Summary" > security-report.md
          echo "" >> security-report.md
          echo "**Scan Date:** $(date -u)" >> security-report.md
          echo "**Commit:** ${{ github.sha }}" >> security-report.md
          echo "" >> security-report.md
          
          echo "## Results" >> security-report.md
          echo "| Scan Type | Status |" >> security-report.md
          echo "|-----------|--------|" >> security-report.md
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> security-report.md
          echo "| Code Analysis | ${{ needs.code-scan.result }} |" >> security-report.md
          echo "| Firebase Rules | ${{ needs.firebase-security-scan.result }} |" >> security-report.md
          echo "" >> security-report.md
          
          # Check if any scans failed
          if [[ "${{ needs.dependency-scan.result }}" == "failure" || 
                "${{ needs.code-scan.result }}" == "failure" || 
                "${{ needs.firebase-security-scan.result }}" == "failure" ]]; then
            echo "❌ Security vulnerabilities detected!"
            echo "**Status: FAILED** ❌" >> security-report.md
          else
            echo "✅ All security scans passed"
            echo "**Status: PASSED** ✅" >> security-report.md
          fi
          
      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: security-report.md