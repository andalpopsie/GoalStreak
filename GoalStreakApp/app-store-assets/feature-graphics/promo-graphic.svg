<?xml version="1.0" encoding="UTF-8"?>
<svg width="180" height="120" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF894F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:1" />
    </linearGradient>
    <style>
      .title-text { fill: #FFFFFF; font-family: 'Montserrat', sans-serif; font-weight: 800; }
      .subtitle-text { fill: #FFFFFF; font-family: 'Montserrat', sans-serif; font-weight: 500; }
      .feature-text { fill: #FFFFFF; font-family: 'Montserrat', sans-serif; font-weight: 400; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <!-- Left side - Text content -->
  <g transform="translate(60, 80)">
    <text x="0" y="0" class="title-text" font-size="48">Goalfer</text>
    <text x="0" y="50" class="subtitle-text" font-size="24">Build lasting habits with friends</text>
    
    <!-- Feature highlights -->
    <g transform="translate(0, 100)">
      
        <text x="0" y="0" class="feature-text" font-size="18">🎯 Track habits & streaks</text>
      
        <text x="0" y="35" class="feature-text" font-size="18">👥 Social accountability</text>
      
        <text x="0" y="70" class="feature-text" font-size="18">📊 Powerful analytics</text>
      
    </g>
  </g>
  
  <!-- Right side - App mockup -->
  <g transform="translate(600, 50)">
    <!-- Phone frame -->
    <rect x="0" y="0" width="300" height="400" rx="30" fill="#FFFFFF" stroke="#154D71" stroke-width="4"/>
    
    <!-- Screen content -->
    <g transform="translate(20, 20)">
      <!-- Header -->
      <rect x="0" y="0" width="260" height="40" fill="#FDFDFD"/>
      <text x="130" y="25" text-anchor="middle" fill="#154D71" font-size="16" font-weight="600">Goalfer</text>
      
      <!-- Habit cards -->
      
        <g transform="translate(0, 60)">
          <rect x="0" y="0" width="260" height="70" rx="8" fill="#FDFDFD"/>
          <circle cx="35" cy="35" r="20" fill="none" stroke="#FF894F" stroke-width="3"/>
          <circle cx="35" cy="35" r="20" fill="none" stroke="#4A90A4" stroke-width="3" 
                  stroke-dasharray="75.39822368615503" stroke-dashoffset="31.41592653589793"/>
          <text x="70" y="25" fill="#154D71" font-size="14" font-weight="600">Meditation</text>
          <text x="70" y="45" fill="#154D71" font-size="12">7 day streak</text>
        </g>
      
        <g transform="translate(0, 140)">
          <rect x="0" y="0" width="260" height="70" rx="8" fill="#FDFDFD"/>
          <circle cx="35" cy="35" r="20" fill="none" stroke="#FF894F" stroke-width="3"/>
          <circle cx="35" cy="35" r="20" fill="none" stroke="#4A90A4" stroke-width="3" 
                  stroke-dasharray="94.24777960769379" stroke-dashoffset="31.41592653589793"/>
          <text x="70" y="25" fill="#154D71" font-size="14" font-weight="600">Exercise</text>
          <text x="70" y="45" fill="#154D71" font-size="12">12 day streak</text>
        </g>
      
        <g transform="translate(0, 220)">
          <rect x="0" y="0" width="260" height="70" rx="8" fill="#FDFDFD"/>
          <circle cx="35" cy="35" r="20" fill="none" stroke="#FF894F" stroke-width="3"/>
          <circle cx="35" cy="35" r="20" fill="none" stroke="#4A90A4" stroke-width="3" 
                  stroke-dasharray="113.09733552923254" stroke-dashoffset="31.41592653589793"/>
          <text x="70" y="25" fill="#154D71" font-size="14" font-weight="600">Reading</text>
          <text x="70" y="45" fill="#154D71" font-size="12">5 day streak</text>
        </g>
      
    </g>
  </g>
</svg>