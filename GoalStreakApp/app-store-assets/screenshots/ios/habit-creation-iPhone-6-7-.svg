<?xml version="1.0" encoding="UTF-8"?>
<svg width="1290" height="2796" viewBox="0 0 1290 2796" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #FDFDFD; }
      .primary-text { fill: #154D71; font-family: 'Montserrat', sans-serif; font-weight: 700; }
      .secondary-text { fill: #154D71; font-family: 'Montserrat', sans-serif; font-weight: 500; }
      .accent { fill: #FF894F; }
      .accent3 { fill: #4A90A4; }
      .feature-text { fill: #154D71; font-family: 'Montserrat', sans-serif; font-weight: 400; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" class="bg"/>
  
  <!-- Status Bar (iOS style) -->
  
  <rect x="0" y="0" width="100%" height="44" fill="#FFFFFF"/>
  <text x="645" y="30" text-anchor="middle" class="primary-text" font-size="16" font-weight="600">9:41</text>
  
  
  <!-- Header -->
  <rect x="0" y="44" width="100%" height="80" fill="#FFFFFF"/>
  <text x="32" y="94" class="primary-text" font-size="24" font-weight="700">Goalfer</text>
  
  <!-- Main Content Area -->
  <g transform="translate(32, 160)">
    <!-- Title -->
    <text x="0" y="0" class="primary-text" font-size="32" font-weight="700">Create Custom Habits</text>
    <text x="0" y="50" class="secondary-text" font-size="18">Personalize your journey</text>
    
    <!-- Mock UI Elements based on screen type -->
    
          <!-- Habit Creation Form -->
          <g transform="translate(0, 100)">
            <!-- Input Field -->
            <rect x="0" y="0" width="1226" height="50" rx="8" fill="#FFFFFF" stroke="#154D71" stroke-width="1"/>
            <text x="16" y="30" class="feature-text" font-size="16">Morning Meditation</text>
            
            <!-- Category Icons -->
            <g transform="translate(0, 80)">
              <text x="0" y="0" class="primary-text" font-size="18" font-weight="600">Choose Category</text>
              
                <g transform="translate(0, 30)">
                  <circle cx="25" cy="25" r="25" fill="#FF894F" 
                          stroke="#154D71" stroke-width="2"/>
                  <text x="25" y="35" text-anchor="middle" font-size="20">🧘‍♀️</text>
                </g>
              
                <g transform="translate(60, 30)">
                  <circle cx="25" cy="25" r="25" fill="#FFFFFF" 
                          stroke="#154D71" stroke-width="2"/>
                  <text x="25" y="35" text-anchor="middle" font-size="20">💪</text>
                </g>
              
                <g transform="translate(120, 30)">
                  <circle cx="25" cy="25" r="25" fill="#FFFFFF" 
                          stroke="#154D71" stroke-width="2"/>
                  <text x="25" y="35" text-anchor="middle" font-size="20">📚</text>
                </g>
              
                <g transform="translate(180, 30)">
                  <circle cx="25" cy="25" r="25" fill="#FFFFFF" 
                          stroke="#154D71" stroke-width="2"/>
                  <text x="25" y="35" text-anchor="middle" font-size="20">💧</text>
                </g>
              
                <g transform="translate(240, 30)">
                  <circle cx="25" cy="25" r="25" fill="#FFFFFF" 
                          stroke="#154D71" stroke-width="2"/>
                  <text x="25" y="35" text-anchor="middle" font-size="20">🎯</text>
                </g>
              
                <g transform="translate(300, 30)">
                  <circle cx="25" cy="25" r="25" fill="#FFFFFF" 
                          stroke="#154D71" stroke-width="2"/>
                  <text x="25" y="35" text-anchor="middle" font-size="20">🌱</text>
                </g>
              
            </g>
            
            <!-- Frequency Selection -->
            <g transform="translate(0, 180)">
              <text x="0" y="0" class="primary-text" font-size="18" font-weight="600">Frequency</text>
              
                <rect x="0" y="20" width="80" height="40" rx="20" 
                      fill="#FF894F" 
                      stroke="#154D71" stroke-width="1"/>
                <text x="40" y="45" text-anchor="middle" 
                      class="bg" font-size="14">Daily</text>
              
                <rect x="100" y="20" width="80" height="40" rx="20" 
                      fill="#FFFFFF" 
                      stroke="#154D71" stroke-width="1"/>
                <text x="140" y="45" text-anchor="middle" 
                      class="primary-text" font-size="14">Weekly</text>
              
                <rect x="200" y="20" width="80" height="40" rx="20" 
                      fill="#FFFFFF" 
                      stroke="#154D71" stroke-width="1"/>
                <text x="240" y="45" text-anchor="middle" 
                      class="primary-text" font-size="14">Monthly</text>
              
            </g>
          </g>
        
    
    <!-- Feature List -->
    <g transform="translate(0, 2396)">
      
        <g transform="translate(0, 0)">
          <circle cx="8" cy="8" r="6" class="accent"/>
          <text x="24" y="12" class="feature-text" font-size="16">Custom categories</text>
        </g>
      
        <g transform="translate(0, 40)">
          <circle cx="8" cy="8" r="6" class="accent"/>
          <text x="24" y="12" class="feature-text" font-size="16">Flexible scheduling</text>
        </g>
      
        <g transform="translate(0, 80)">
          <circle cx="8" cy="8" r="6" class="accent"/>
          <text x="24" y="12" class="feature-text" font-size="16">Privacy controls</text>
        </g>
      
    </g>
  </g>
  
  <!-- Bottom Navigation (if mobile) -->
  
  <rect x="0" y="2716" width="100%" height="80" fill="#FFFFFF"/>
  <g transform="translate(161.25, 2736)">
    
      <g transform="translate(0, 0)">
        <circle cx="0" cy="-10" r="12" fill="#FF894F"/>
        <text x="0" y="20" text-anchor="middle" class="feature-text" font-size="12">Home</text>
      </g>
    
      <g transform="translate(322.5, 0)">
        <circle cx="0" cy="-10" r="12" fill="#154D71"/>
        <text x="0" y="20" text-anchor="middle" class="feature-text" font-size="12">Social</text>
      </g>
    
      <g transform="translate(645, 0)">
        <circle cx="0" cy="-10" r="12" fill="#154D71"/>
        <text x="0" y="20" text-anchor="middle" class="feature-text" font-size="12">Analytics</text>
      </g>
    
      <g transform="translate(967.5, 0)">
        <circle cx="0" cy="-10" r="12" fill="#154D71"/>
        <text x="0" y="20" text-anchor="middle" class="feature-text" font-size="12">Profile</text>
      </g>
    
  </g>
  
</svg>