<?xml version="1.0" encoding="UTF-8"?>
<svg width="2048" height="2732" viewBox="0 0 2048 2732" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #FDFDFD; }
      .primary-text { fill: #154D71; font-family: 'Montserrat', sans-serif; font-weight: 700; }
      .secondary-text { fill: #154D71; font-family: 'Montserrat', sans-serif; font-weight: 500; }
      .accent { fill: #FF894F; }
      .accent3 { fill: #4A90A4; }
      .feature-text { fill: #154D71; font-family: 'Montserrat', sans-serif; font-weight: 400; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" class="bg"/>
  
  <!-- Status Bar (iOS style) -->
  
  <rect x="0" y="0" width="100%" height="44" fill="#FFFFFF"/>
  <text x="1024" y="30" text-anchor="middle" class="primary-text" font-size="16" font-weight="600">9:41</text>
  
  
  <!-- Header -->
  <rect x="0" y="44" width="100%" height="80" fill="#FFFFFF"/>
  <text x="32" y="94" class="primary-text" font-size="24" font-weight="700">GoalStreak</text>
  
  <!-- Main Content Area -->
  <g transform="translate(32, 160)">
    <!-- Title -->
    <text x="0" y="0" class="primary-text" font-size="32" font-weight="700">Track Your Habits</text>
    <text x="0" y="50" class="secondary-text" font-size="18">Beautiful progress visualization</text>
    
    <!-- Mock UI Elements based on screen type -->
    
          <!-- Habit Cards -->
          
            <g transform="translate(0, 100)">
              <rect x="0" y="0" width="1984" height="100" rx="12" fill="#FFFFFF" stroke="#154D71" stroke-width="1"/>
              <circle cx="60" cy="50" r="30" fill="none" stroke="#4A90A4" stroke-width="4"/>
              <circle cx="60" cy="50" r="30" fill="none" stroke="#FF894F" stroke-width="4" 
                      stroke-dasharray="131.9468914507713" stroke-dashoffset="47.12388980384689"/>
              <text x="120" y="35" class="primary-text" font-size="18" font-weight="600">Morning Meditation</text>
              <text x="120" y="55" class="secondary-text" font-size="14">7 day streak</text>
              <text x="120" y="75" class="feature-text" font-size="12">🧘‍♀️ Mindfulness</text>
            </g>
          
            <g transform="translate(0, 220)">
              <rect x="0" y="0" width="1984" height="100" rx="12" fill="#FFFFFF" stroke="#154D71" stroke-width="1"/>
              <circle cx="60" cy="50" r="30" fill="none" stroke="#4A90A4" stroke-width="4"/>
              <circle cx="60" cy="50" r="30" fill="none" stroke="#FF894F" stroke-width="4" 
                      stroke-dasharray="150.79644737231004" stroke-dashoffset="47.12388980384689"/>
              <text x="120" y="35" class="primary-text" font-size="18" font-weight="600">Daily Exercise</text>
              <text x="120" y="55" class="secondary-text" font-size="14">12 day streak</text>
              <text x="120" y="75" class="feature-text" font-size="12">💪 Fitness</text>
            </g>
          
            <g transform="translate(0, 340)">
              <rect x="0" y="0" width="1984" height="100" rx="12" fill="#FFFFFF" stroke="#154D71" stroke-width="1"/>
              <circle cx="60" cy="50" r="30" fill="none" stroke="#4A90A4" stroke-width="4"/>
              <circle cx="60" cy="50" r="30" fill="none" stroke="#FF894F" stroke-width="4" 
                      stroke-dasharray="169.6460032938488" stroke-dashoffset="47.12388980384689"/>
              <text x="120" y="35" class="primary-text" font-size="18" font-weight="600">Read 30 Minutes</text>
              <text x="120" y="55" class="secondary-text" font-size="14">5 day streak</text>
              <text x="120" y="75" class="feature-text" font-size="12">📚 Learning</text>
            </g>
          
        
    
    <!-- Feature List -->
    <g transform="translate(0, 2332)">
      
        <g transform="translate(0, 0)">
          <circle cx="8" cy="8" r="6" class="accent"/>
          <text x="24" y="12" class="feature-text" font-size="16">39+ habit categories</text>
        </g>
      
        <g transform="translate(0, 40)">
          <circle cx="8" cy="8" r="6" class="accent"/>
          <text x="24" y="12" class="feature-text" font-size="16">Circular progress indicators</text>
        </g>
      
        <g transform="translate(0, 80)">
          <circle cx="8" cy="8" r="6" class="accent"/>
          <text x="24" y="12" class="feature-text" font-size="16">Streak celebrations</text>
        </g>
      
    </g>
  </g>
  
  <!-- Bottom Navigation (if mobile) -->
  
  <rect x="0" y="2652" width="100%" height="80" fill="#FFFFFF"/>
  <g transform="translate(256, 2672)">
    
      <g transform="translate(0, 0)">
        <circle cx="0" cy="-10" r="12" fill="#154D71"/>
        <text x="0" y="20" text-anchor="middle" class="feature-text" font-size="12">Home</text>
      </g>
    
      <g transform="translate(512, 0)">
        <circle cx="0" cy="-10" r="12" fill="#FF894F"/>
        <text x="0" y="20" text-anchor="middle" class="feature-text" font-size="12">Social</text>
      </g>
    
      <g transform="translate(1024, 0)">
        <circle cx="0" cy="-10" r="12" fill="#154D71"/>
        <text x="0" y="20" text-anchor="middle" class="feature-text" font-size="12">Analytics</text>
      </g>
    
      <g transform="translate(1536, 0)">
        <circle cx="0" cy="-10" r="12" fill="#154D71"/>
        <text x="0" y="20" text-anchor="middle" class="feature-text" font-size="12">Profile</text>
      </g>
    
  </g>
  
</svg>