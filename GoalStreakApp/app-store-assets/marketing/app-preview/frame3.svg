<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF894F;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:0.1" />
    </linearGradient>
    <style>
      .title-text { fill: #154D71; font-family: 'Montserrat', sans-serif; font-weight: 800; }
      .subtitle-text { fill: #154D71; font-family: 'Montserrat', sans-serif; font-weight: 500; }
      .feature-text { fill: #154D71; font-family: 'Montserrat', sans-serif; font-weight: 400; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#FDFDFD"/>
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <!-- Phone mockup -->
  <g transform="translate(340, 200)">
    <!-- Phone frame -->
    <rect x="0" y="0" width="400" height="800" rx="40" fill="#000000"/>
    <rect x="10" y="10" width="380" height="780" rx="30" fill="#FDFDFD"/>
    
    <!-- Screen content based on frame type -->
    
          <g transform="translate(20, 60)">
            
              <g transform="translate(0, 0)">
                <rect x="0" y="0" width="340" height="80" rx="8" fill="#FFFFFF"/>
                <circle cx="40" cy="40" r="20" fill="#154D71"/>
                <text x="80" y="25" fill="#154D71" font-size="16" font-weight="600">Sarah completed</text>
                <text x="80" y="45" fill="#666666" font-size="14">Morning Run</text>
                <g transform="translate(260, 25)">
                  <text font-size="20">❤️</text>
                  <text x="30" font-size="20">🔥</text>
                  <text x="60" font-size="20">🏅</text>
                </g>
              </g>
            
              <g transform="translate(0, 100)">
                <rect x="0" y="0" width="340" height="80" rx="8" fill="#FFFFFF"/>
                <circle cx="40" cy="40" r="20" fill="#154D71"/>
                <text x="80" y="25" fill="#154D71" font-size="16" font-weight="600">Mike completed</text>
                <text x="80" y="45" fill="#666666" font-size="14">Meditation</text>
                <g transform="translate(260, 25)">
                  <text font-size="20">❤️</text>
                  <text x="30" font-size="20">🔥</text>
                  <text x="60" font-size="20">🏅</text>
                </g>
              </g>
            
              <g transform="translate(0, 200)">
                <rect x="0" y="0" width="340" height="80" rx="8" fill="#FFFFFF"/>
                <circle cx="40" cy="40" r="20" fill="#154D71"/>
                <text x="80" y="25" fill="#154D71" font-size="16" font-weight="600">Emma completed</text>
                <text x="80" y="45" fill="#666666" font-size="14">Reading</text>
                <g transform="translate(260, 25)">
                  <text font-size="20">❤️</text>
                  <text x="30" font-size="20">🔥</text>
                  <text x="60" font-size="20">🏅</text>
                </g>
              </g>
            
          </g>
        
  </g>
  
  <!-- Text overlay -->
  <g transform="translate(540, 1100)">
    <text x="0" y="0" text-anchor="middle" class="title-text" font-size="48">Stay Accountable Together</text>
    <text x="0" y="80" text-anchor="middle" class="subtitle-text" font-size="28">Connect with friends for motivation</text>
  </g>
  
  <!-- Progress indicator -->
  <g transform="translate(540, 1300)">
    
      <circle cx="-60" cy="0" r="8" 
              fill="#E8E8E8"/>
    
      <circle cx="-30" cy="0" r="8" 
              fill="#E8E8E8"/>
    
      <circle cx="0" cy="0" r="8" 
              fill="#FF894F"/>
    
      <circle cx="30" cy="0" r="8" 
              fill="#E8E8E8"/>
    
      <circle cx="60" cy="0" r="8" 
              fill="#E8E8E8"/>
    
  </g>
</svg>