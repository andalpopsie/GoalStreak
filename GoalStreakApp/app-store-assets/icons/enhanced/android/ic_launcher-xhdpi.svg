<?xml version="1.0" encoding="UTF-8"?>
<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced gradient with better contrast -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF894F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF7F3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Inner glow effect -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.96" stdDeviation="0.48" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <style>
      .icon-text { 
        fill: #FFFFFF; 
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; 
        font-weight: 800; 
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>
  
  <!-- Background with enhanced gradient -->
  <rect width="100%" height="100%" rx="19.200000000000003" fill="url(#bgGradient)"/>
  
  <!-- Inner glow overlay -->
  <rect width="100%" height="100%" rx="19.200000000000003" fill="url(#innerGlow)"/>
  
  <!-- Main Icon - Enhanced Target/Goal Symbol -->
  <g transform="translate(48, 48)" filter="url(#shadow)">
    <!-- Outer ring with enhanced styling -->
    <circle cx="0" cy="0" r="30.72" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="4" 
            opacity="0.9"/>
    
    <!-- Middle ring -->
    <circle cx="0" cy="0" r="21.12" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="3" 
            opacity="0.8"/>
    
    <!-- Inner filled circle (bullseye) -->
    <circle cx="0" cy="0" r="11.52" 
            fill="#FFFFFF" 
            opacity="0.95"/>
    
    <!-- Enhanced streak indicator (flame/arrow) -->
    <g transform="translate(17.28, -17.28)">
      <!-- Main flame shape -->
      <path d="M 0,0 
               Q 4.608,-6.144 7.68,-1.536
               Q 9.216,1.536 6.144,4.608
               Q 3.072,3.072 0,0 Z" 
            fill="#FF894F" 
            opacity="0.9"/>
      
      <!-- Inner flame highlight -->
      <path d="M 1.536,0.768
               Q 3.84,-3.072 5.3759999999999994,-0.768
               Q 6.144,1.536 3.84,3.072
               Q 2.304,2.304 1.536,0.768 Z" 
            fill="#FFFFFF" 
            opacity="0.6"/>
    </g>
    
    <!-- Progress indicator dots (optional for larger sizes) -->
    
  </g>
  
  <!-- App name for very large sizes -->
  
</svg>