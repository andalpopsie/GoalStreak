<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced gradient with better contrast -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF894F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF7F3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Inner glow effect -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5.12" stdDeviation="2.56" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <style>
      .icon-text { 
        fill: #FFFFFF; 
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; 
        font-weight: 800; 
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>
  
  <!-- Background with enhanced gradient -->
  <rect width="100%" height="100%" rx="102.4" fill="url(#bgGradient)"/>
  
  <!-- Inner glow overlay -->
  <rect width="100%" height="100%" rx="102.4" fill="url(#innerGlow)"/>
  
  <!-- Main Icon - Enhanced Target/Goal Symbol -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Outer ring with enhanced styling -->
    <circle cx="0" cy="0" r="163.84" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="20.48" 
            opacity="0.9"/>
    
    <!-- Middle ring -->
    <circle cx="0" cy="0" r="112.64" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="15.36" 
            opacity="0.8"/>
    
    <!-- Inner filled circle (bullseye) -->
    <circle cx="0" cy="0" r="61.44" 
            fill="#FFFFFF" 
            opacity="0.95"/>
    
    <!-- Enhanced streak indicator (flame/arrow) -->
    <g transform="translate(92.16, -92.16)">
      <!-- Main flame shape -->
      <path d="M 0,0 
               Q 24.576,-32.768 40.96,-8.192
               Q 49.152,8.192 32.768,24.576
               Q 16.384,16.384 0,0 Z" 
            fill="#FF894F" 
            opacity="0.9"/>
      
      <!-- Inner flame highlight -->
      <path d="M 8.192,4.096
               Q 20.48,-16.384 28.671999999999997,-4.096
               Q 32.768,8.192 20.48,16.384
               Q 12.288,12.288 8.192,4.096 Z" 
            fill="#FFFFFF" 
            opacity="0.6"/>
    </g>
    
    <!-- Progress indicator dots (optional for larger sizes) -->
    
    <g opacity="0.7">
      <circle cx="1.1913364062105452e-14" cy="-194.56" r="8.192" fill="#FFFFFF" opacity="0.9"/><circle cx="168.4939025603004" cy="97.27999999999999" r="8.192" fill="#FFFFFF" opacity="0.7"/><circle cx="-168.4939025603004" cy="97.27999999999999" r="8.192" fill="#FFFFFF" opacity="0.5"/>
    </g>
    
  </g>
  
  <!-- App name for very large sizes -->
  
  <text x="256" y="450.56" class="icon-text" font-size="30.72">Goalfer</text>
  
</svg>