<?xml version="1.0" encoding="UTF-8"?>
<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced gradient with better contrast -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF894F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF7F3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Inner glow effect -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.92" stdDeviation="0.96" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <style>
      .icon-text { 
        fill: #FFFFFF; 
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; 
        font-weight: 800; 
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>
  
  <!-- Background with enhanced gradient -->
  <rect width="100%" height="100%" rx="38.400000000000006" fill="url(#bgGradient)"/>
  
  <!-- Inner glow overlay -->
  <rect width="100%" height="100%" rx="38.400000000000006" fill="url(#innerGlow)"/>
  
  <!-- Main Icon - Enhanced Target/Goal Symbol -->
  <g transform="translate(96, 96)" filter="url(#shadow)">
    <!-- Outer ring with enhanced styling -->
    <circle cx="0" cy="0" r="61.44" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="7.68" 
            opacity="0.9"/>
    
    <!-- Middle ring -->
    <circle cx="0" cy="0" r="42.24" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="5.76" 
            opacity="0.8"/>
    
    <!-- Inner filled circle (bullseye) -->
    <circle cx="0" cy="0" r="23.04" 
            fill="#FFFFFF" 
            opacity="0.95"/>
    
    <!-- Enhanced streak indicator (flame/arrow) -->
    <g transform="translate(34.56, -34.56)">
      <!-- Main flame shape -->
      <path d="M 0,0 
               Q 9.216,-12.288 15.36,-3.072
               Q 18.432,3.072 12.288,9.216
               Q 6.144,6.144 0,0 Z" 
            fill="#FF894F" 
            opacity="0.9"/>
      
      <!-- Inner flame highlight -->
      <path d="M 3.072,1.536
               Q 7.68,-6.144 10.751999999999999,-1.536
               Q 12.288,3.072 7.68,6.144
               Q 4.608,4.608 3.072,1.536 Z" 
            fill="#FFFFFF" 
            opacity="0.6"/>
    </g>
    
    <!-- Progress indicator dots (optional for larger sizes) -->
    
    <g opacity="0.7">
      <circle cx="4.467511523289544e-15" cy="-72.96" r="3.072" fill="#FFFFFF" opacity="0.9"/><circle cx="63.18521346011264" cy="36.47999999999999" r="3.072" fill="#FFFFFF" opacity="0.7"/><circle cx="-63.18521346011264" cy="36.47999999999999" r="3.072" fill="#FFFFFF" opacity="0.5"/>
    </g>
    
  </g>
  
  <!-- App name for very large sizes -->
  
</svg>