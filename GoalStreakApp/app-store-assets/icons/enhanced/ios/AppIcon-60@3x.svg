<?xml version="1.0" encoding="UTF-8"?>
<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced gradient with better contrast -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF894F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF7F3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Inner glow effect -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.8" stdDeviation="0.9" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <style>
      .icon-text { 
        fill: #FFFFFF; 
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; 
        font-weight: 800; 
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>
  
  <!-- Background with enhanced gradient -->
  <rect width="100%" height="100%" rx="36" fill="url(#bgGradient)"/>
  
  <!-- Inner glow overlay -->
  <rect width="100%" height="100%" rx="36" fill="url(#innerGlow)"/>
  
  <!-- Main Icon - Enhanced Target/Goal Symbol -->
  <g transform="translate(90, 90)" filter="url(#shadow)">
    <!-- Outer ring with enhanced styling -->
    <circle cx="0" cy="0" r="57.6" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="7.2" 
            opacity="0.9"/>
    
    <!-- Middle ring -->
    <circle cx="0" cy="0" r="39.6" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="5.4" 
            opacity="0.8"/>
    
    <!-- Inner filled circle (bullseye) -->
    <circle cx="0" cy="0" r="21.599999999999998" 
            fill="#FFFFFF" 
            opacity="0.95"/>
    
    <!-- Enhanced streak indicator (flame/arrow) -->
    <g transform="translate(32.4, -32.4)">
      <!-- Main flame shape -->
      <path d="M 0,0 
               Q 8.64,-11.520000000000001 14.4,-2.8800000000000003
               Q 17.28,2.8800000000000003 11.520000000000001,8.64
               Q 5.760000000000001,5.760000000000001 0,0 Z" 
            fill="#FF894F" 
            opacity="0.9"/>
      
      <!-- Inner flame highlight -->
      <path d="M 2.8800000000000003,1.4400000000000002
               Q 7.2,-5.760000000000001 10.08,-1.4400000000000002
               Q 11.520000000000001,2.8800000000000003 7.2,5.760000000000001
               Q 4.32,4.32 2.8800000000000003,1.4400000000000002 Z" 
            fill="#FFFFFF" 
            opacity="0.6"/>
    </g>
    
    <!-- Progress indicator dots (optional for larger sizes) -->
    
    <g opacity="0.7">
      <circle cx="4.188292053083948e-15" cy="-68.4" r="2.8800000000000003" fill="#FFFFFF" opacity="0.9"/><circle cx="59.236137618855615" cy="34.199999999999996" r="2.8800000000000003" fill="#FFFFFF" opacity="0.7"/><circle cx="-59.236137618855615" cy="34.199999999999996" r="2.8800000000000003" fill="#FFFFFF" opacity="0.5"/>
    </g>
    
  </g>
  
  <!-- App name for very large sizes -->
  
</svg>