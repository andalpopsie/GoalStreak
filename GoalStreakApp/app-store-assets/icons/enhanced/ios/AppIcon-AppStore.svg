<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced gradient with better contrast -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF894F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF7F3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Inner glow effect -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10.24" stdDeviation="5.12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <style>
      .icon-text { 
        fill: #FFFFFF; 
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; 
        font-weight: 800; 
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>
  
  <!-- Background with enhanced gradient -->
  <rect width="100%" height="100%" rx="204.8" fill="url(#bgGradient)"/>
  
  <!-- Inner glow overlay -->
  <rect width="100%" height="100%" rx="204.8" fill="url(#innerGlow)"/>
  
  <!-- Main Icon - Enhanced Target/Goal Symbol -->
  <g transform="translate(512, 512)" filter="url(#shadow)">
    <!-- Outer ring with enhanced styling -->
    <circle cx="0" cy="0" r="327.68" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="40.96" 
            opacity="0.9"/>
    
    <!-- Middle ring -->
    <circle cx="0" cy="0" r="225.28" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="30.72" 
            opacity="0.8"/>
    
    <!-- Inner filled circle (bullseye) -->
    <circle cx="0" cy="0" r="122.88" 
            fill="#FFFFFF" 
            opacity="0.95"/>
    
    <!-- Enhanced streak indicator (flame/arrow) -->
    <g transform="translate(184.32, -184.32)">
      <!-- Main flame shape -->
      <path d="M 0,0 
               Q 49.152,-65.536 81.92,-16.384
               Q 98.304,16.384 65.536,49.152
               Q 32.768,32.768 0,0 Z" 
            fill="#FF894F" 
            opacity="0.9"/>
      
      <!-- Inner flame highlight -->
      <path d="M 16.384,8.192
               Q 40.96,-32.768 57.343999999999994,-8.192
               Q 65.536,16.384 40.96,32.768
               Q 24.576,24.576 16.384,8.192 Z" 
            fill="#FFFFFF" 
            opacity="0.6"/>
    </g>
    
    <!-- Progress indicator dots (optional for larger sizes) -->
    
    <g opacity="0.7">
      <circle cx="2.3826728124210905e-14" cy="-389.12" r="16.384" fill="#FFFFFF" opacity="0.9"/><circle cx="336.9878051206008" cy="194.55999999999997" r="16.384" fill="#FFFFFF" opacity="0.7"/><circle cx="-336.9878051206008" cy="194.55999999999997" r="16.384" fill="#FFFFFF" opacity="0.5"/>
    </g>
    
  </g>
  
  <!-- App name for very large sizes -->
  
  <text x="512" y="901.12" class="icon-text" font-size="61.44">Goalfer</text>
  
</svg>