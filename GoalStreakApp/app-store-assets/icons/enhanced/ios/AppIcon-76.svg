<?xml version="1.0" encoding="UTF-8"?>
<svg width="76" height="76" viewBox="0 0 76 76" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced gradient with better contrast -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF894F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF7F3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Inner glow effect -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.76" stdDeviation="0.38" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <style>
      .icon-text { 
        fill: #FFFFFF; 
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; 
        font-weight: 800; 
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>
  
  <!-- Background with enhanced gradient -->
  <rect width="100%" height="100%" rx="15.200000000000001" fill="url(#bgGradient)"/>
  
  <!-- Inner glow overlay -->
  <rect width="100%" height="100%" rx="15.200000000000001" fill="url(#innerGlow)"/>
  
  <!-- Main Icon - Enhanced Target/Goal Symbol -->
  <g transform="translate(38, 38)" filter="url(#shadow)">
    <!-- Outer ring with enhanced styling -->
    <circle cx="0" cy="0" r="24.32" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="4" 
            opacity="0.9"/>
    
    <!-- Middle ring -->
    <circle cx="0" cy="0" r="16.72" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="3" 
            opacity="0.8"/>
    
    <!-- Inner filled circle (bullseye) -->
    <circle cx="0" cy="0" r="9.12" 
            fill="#FFFFFF" 
            opacity="0.95"/>
    
    <!-- Enhanced streak indicator (flame/arrow) -->
    <g transform="translate(13.68, -13.68)">
      <!-- Main flame shape -->
      <path d="M 0,0 
               Q 3.6479999999999997,-4.864000000000001 6.08,-1.2160000000000002
               Q 7.295999999999999,1.2160000000000002 4.864000000000001,3.6479999999999997
               Q 2.4320000000000004,2.4320000000000004 0,0 Z" 
            fill="#FF894F" 
            opacity="0.9"/>
      
      <!-- Inner flame highlight -->
      <path d="M 1.2160000000000002,0.6080000000000001
               Q 3.04,-2.4320000000000004 4.255999999999999,-0.6080000000000001
               Q 4.864000000000001,1.2160000000000002 3.04,2.4320000000000004
               Q 1.8239999999999998,1.8239999999999998 1.2160000000000002,0.6080000000000001 Z" 
            fill="#FFFFFF" 
            opacity="0.6"/>
    </g>
    
    <!-- Progress indicator dots (optional for larger sizes) -->
    
  </g>
  
  <!-- App name for very large sizes -->
  
</svg>