<?xml version="1.0" encoding="UTF-8"?>
<svg width="144" height="144" viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF894F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:1" />
    </linearGradient>
    <style>
      .icon-text { fill: #FFFFFF; font-family: 'Montserrat', sans-serif; font-weight: 700; }
    </style>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="100%" height="100%" rx="28.8" fill="url(#bgGradient)"/>
  
  <!-- Main Icon - Target/Goal Symbol -->
  <g transform="translate(72, 72)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="50.4" fill="none" stroke="#FFFFFF" stroke-width="5.76"/>
    <!-- Middle circle -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="#FFFFFF" stroke-width="4.32"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="21.599999999999998" fill="#FFFFFF"/>
    
    <!-- Streak indicator (flame-like shape) -->
    <g transform="translate(21.599999999999998, -21.599999999999998)">
      <path d="M 0,0 Q 11.52,-11.52 17.28,0 Q 11.52,5.76 0,0" 
            fill="#FF894F"/>
    </g>
  </g>
  
  <!-- App name (for larger sizes) -->
  
</svg>