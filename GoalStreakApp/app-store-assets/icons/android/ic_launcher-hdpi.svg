<?xml version="1.0" encoding="UTF-8"?>
<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF894F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:1" />
    </linearGradient>
    <style>
      .icon-text { fill: #FFFFFF; font-family: 'Montserrat', sans-serif; font-weight: 700; }
    </style>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="100%" height="100%" rx="14.4" fill="url(#bgGradient)"/>
  
  <!-- Main Icon - Target/Goal Symbol -->
  <g transform="translate(36, 36)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="25.2" fill="none" stroke="#FFFFFF" stroke-width="2.88"/>
    <!-- Middle circle -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#FFFFFF" stroke-width="2.16"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="10.799999999999999" fill="#FFFFFF"/>
    
    <!-- Streak indicator (flame-like shape) -->
    <g transform="translate(10.799999999999999, -10.799999999999999)">
      <path d="M 0,0 Q 5.76,-5.76 8.64,0 Q 5.76,2.88 0,0" 
            fill="#FF894F"/>
    </g>
  </g>
  
  <!-- App name (for larger sizes) -->
  
</svg>