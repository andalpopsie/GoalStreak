<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF894F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:1" />
    </linearGradient>
    <style>
      .icon-text { fill: #FFFFFF; font-family: 'Montserrat', sans-serif; font-weight: 700; }
    </style>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="100%" height="100%" rx="9.600000000000001" fill="url(#bgGradient)"/>
  
  <!-- Main Icon - Target/Goal Symbol -->
  <g transform="translate(24, 24)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="16.799999999999997" fill="none" stroke="#FFFFFF" stroke-width="1.92"/>
    <!-- Middle circle -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#FFFFFF" stroke-width="1.44"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="7.199999999999999" fill="#FFFFFF"/>
    
    <!-- Streak indicator (flame-like shape) -->
    <g transform="translate(7.199999999999999, -7.199999999999999)">
      <path d="M 0,0 Q 3.84,-3.84 5.76,0 Q 3.84,1.92 0,0" 
            fill="#FF894F"/>
    </g>
  </g>
  
  <!-- App name (for larger sizes) -->
  
</svg>