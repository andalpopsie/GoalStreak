<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF894F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:1" />
    </linearGradient>
    <style>
      .icon-text { fill: #FFFFFF; font-family: 'Montserrat', sans-serif; font-weight: 700; }
    </style>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="100%" height="100%" rx="102.4" fill="url(#bgGradient)"/>
  
  <!-- Main Icon - Target/Goal Symbol -->
  <g transform="translate(256, 256)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="179.2" fill="none" stroke="#FFFFFF" stroke-width="20.48"/>
    <!-- Middle circle -->
    <circle cx="0" cy="0" r="128" fill="none" stroke="#FFFFFF" stroke-width="15.36"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="76.8" fill="#FFFFFF"/>
    
    <!-- Streak indicator (flame-like shape) -->
    <g transform="translate(76.8, -76.8)">
      <path d="M 0,0 Q 40.96,-40.96 61.44,0 Q 40.96,20.48 0,0" 
            fill="#FF894F"/>
    </g>
  </g>
  
  <!-- App name (for larger sizes) -->
  
  <text x="256" y="460.8" text-anchor="middle" class="icon-text" font-size="40.96">GoalStreak</text>
  
</svg>