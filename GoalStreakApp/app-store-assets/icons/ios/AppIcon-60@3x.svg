<?xml version="1.0" encoding="UTF-8"?>
<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF894F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:1" />
    </linearGradient>
    <style>
      .icon-text { fill: #FFFFFF; font-family: 'Montserrat', sans-serif; font-weight: 700; }
    </style>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="100%" height="100%" rx="36" fill="url(#bgGradient)"/>
  
  <!-- Main Icon - Target/Goal Symbol -->
  <g transform="translate(90, 90)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="62.99999999999999" fill="none" stroke="#FFFFFF" stroke-width="7.2"/>
    <!-- Middle circle -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#FFFFFF" stroke-width="5.3999999999999995"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="27" fill="#FFFFFF"/>
    
    <!-- Streak indicator (flame-like shape) -->
    <g transform="translate(27, -27)">
      <path d="M 0,0 Q 14.4,-14.4 21.599999999999998,0 Q 14.4,7.2 0,0" 
            fill="#FF894F"/>
    </g>
  </g>
  
  <!-- App name (for larger sizes) -->
  
</svg>