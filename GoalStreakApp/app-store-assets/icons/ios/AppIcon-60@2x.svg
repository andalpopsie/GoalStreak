<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF894F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:1" />
    </linearGradient>
    <style>
      .icon-text { fill: #FFFFFF; font-family: 'Montserrat', sans-serif; font-weight: 700; }
    </style>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="100%" height="100%" rx="24" fill="url(#bgGradient)"/>
  
  <!-- Main Icon - Target/Goal Symbol -->
  <g transform="translate(60, 60)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#FFFFFF" stroke-width="4.8"/>
    <!-- Middle circle -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#FFFFFF" stroke-width="3.5999999999999996"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="18" fill="#FFFFFF"/>
    
    <!-- Streak indicator (flame-like shape) -->
    <g transform="translate(18, -18)">
      <path d="M 0,0 Q 9.6,-9.6 14.399999999999999,0 Q 9.6,4.8 0,0" 
            fill="#FF894F"/>
    </g>
  </g>
  
  <!-- App name (for larger sizes) -->
  
</svg>