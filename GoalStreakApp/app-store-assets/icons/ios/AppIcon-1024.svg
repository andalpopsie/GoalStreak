<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF894F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:1" />
    </linearGradient>
    <style>
      .icon-text { fill: #FFFFFF; font-family: 'Montserrat', sans-serif; font-weight: 700; }
    </style>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="100%" height="100%" rx="204.8" fill="url(#bgGradient)"/>
  
  <!-- Main Icon - Target/Goal Symbol -->
  <g transform="translate(512, 512)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="358.4" fill="none" stroke="#FFFFFF" stroke-width="40.96"/>
    <!-- Middle circle -->
    <circle cx="0" cy="0" r="256" fill="none" stroke="#FFFFFF" stroke-width="30.72"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="153.6" fill="#FFFFFF"/>
    
    <!-- Streak indicator (flame-like shape) -->
    <g transform="translate(153.6, -153.6)">
      <path d="M 0,0 Q 81.92,-81.92 122.88,0 Q 81.92,40.96 0,0" 
            fill="#FF894F"/>
    </g>
  </g>
  
  <!-- App name (for larger sizes) -->
  
  <text x="512" y="921.6" text-anchor="middle" class="icon-text" font-size="81.92">GoalStreak</text>
  
</svg>