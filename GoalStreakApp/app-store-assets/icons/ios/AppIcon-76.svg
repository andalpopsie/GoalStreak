<?xml version="1.0" encoding="UTF-8"?>
<svg width="76" height="76" viewBox="0 0 76 76" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF894F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:1" />
    </linearGradient>
    <style>
      .icon-text { fill: #FFFFFF; font-family: 'Montserrat', sans-serif; font-weight: 700; }
    </style>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="100%" height="100%" rx="15.200000000000001" fill="url(#bgGradient)"/>
  
  <!-- Main Icon - Target/Goal Symbol -->
  <g transform="translate(38, 38)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="26.599999999999998" fill="none" stroke="#FFFFFF" stroke-width="3.04"/>
    <!-- Middle circle -->
    <circle cx="0" cy="0" r="19" fill="none" stroke="#FFFFFF" stroke-width="2.28"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="11.4" fill="#FFFFFF"/>
    
    <!-- Streak indicator (flame-like shape) -->
    <g transform="translate(11.4, -11.4)">
      <path d="M 0,0 Q 6.08,-6.08 9.12,0 Q 6.08,3.04 0,0" 
            fill="#FF894F"/>
    </g>
  </g>
  
  <!-- App name (for larger sizes) -->
  
</svg>